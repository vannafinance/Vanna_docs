<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 480" width="1400" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#120D2A"/>
      <stop offset="100%" stop-color="#0A0718"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B0FF"/>
      <stop offset="100%" stop-color="#8B6FFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="480" fill="url(#bg)" rx="14"/>

  <!-- Center glow -->
  <ellipse cx="700" cy="240" rx="500" ry="280" fill="url(#glow)"/>

  <!-- Subtle border -->
  <rect x="1" y="1" width="1398" height="478" rx="13" fill="none" stroke="#1E1848" stroke-width="1.5"/>

  <!-- Top decorative line -->
  <rect x="600" y="158" width="200" height="1.5" rx="1" fill="url(#lineGrad)"/>

  <!-- Line 1 — main heading -->
  <text x="700" y="232" text-anchor="middle"
        fill="url(#titleGrad)"
        font-size="52" font-weight="700" letter-spacing="-1"
        font-family="'Inter', -apple-system, system-ui, sans-serif">
    Sample Strategies
  </text>

  <!-- Line 2 — subtitle -->
  <text x="700" y="292" text-anchor="middle"
        fill="#7A6EA8"
        font-size="19" font-weight="400" letter-spacing="0.2"
        font-family="'Inter', -apple-system, system-ui, sans-serif">
    Five approaches to earning yield — from fully passive to composable multi-step flows.
  </text>

  <!-- Bottom decorative line -->
  <rect x="600" y="320" width="200" height="1.5" rx="1" fill="url(#lineGrad)"/>

</svg>
